server {
    listen 80;
    server_name localhost; # Replace with your domain if deploying to production

    # 1. Serve the service worker directly from the project directory
    location /service-worker.js {
        alias D:/project/smart-task-manager/service-worker.js;
        
        # Allow the service worker to control the entire domain
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    # 2. Proxy all other traffic to the Streamlit app running on port 8501
    location / {
        proxy_pass http://127.0.0.1:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Required for Streamlit WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}